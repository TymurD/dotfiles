# Noctalia shell config — curated layer. GUI changes land in
# ~/.local/state/noctalia/settings.toml, which overrides this file.

[theme]
source = "custom"
custom_palette = "Monochrome" # palettes/Monochrome.json — the repo's shared grayscale palette
mode = "dark"
shell_mode = "dark"

[shell]
font_family = "JetBrainsMono Nerd Font"
polkit_agent = true # polkit-gnome exec is commented out in hyprland.lua
setup_wizard_enabled = false

# Concentric with the windows: hyprland rounding (16) + gaps_out (12) = 28,
# so the screen edge curve runs parallel to a tiled window's corner.
[shell.screen_corners]
enabled = true
size = 28

# Bar corners match hyprland window rounding (16); per-corner keys default to 12 and
# override `radius`, so they're set too. Pills inside the bar (workspaces, capsules when
# enabled): 0.76 × 34 ≈ 26px tall → 4px from the bar edge → 16 − 4 = 12.
[bar.default]
radius = 16
radius_top_left = 16
radius_top_right = 16
radius_bottom_left = 16
radius_bottom_right = 16
capsule_radius = 12

# Topowall contour wallpaper from this repo (swaybg used to draw it; noctalia owns it now).
[wallpaper.default]
path = "~/.config/hypr/wallpaper_1440p.png"
