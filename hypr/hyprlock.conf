$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 1, linear
    animation = fadeOut, 1, 1, linear
    animation = inputFieldDots, 1, 1, linear
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper_1440p.png
    color = rgba(17, 17, 17, 1.0)
    blur_passes = 0
}

input-field {
    monitor =
    size = 320, 52
    rounding = -1
    outline_thickness = 1
    inner_color = rgba(17, 17, 17, 0.65)
    outer_color = rgba(2e2e2eff)
    check_color = rgba(84a9aeff)
    fail_color = rgba(c9a26dff)

    font_color = rgb(242, 242, 242)
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##666666">Password</span>
    fail_text = <span foreground="##c9a26d">$PAMFAIL$FPRINTFAIL</span>
    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = $font
    color = rgb(242, 242, 242)

    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 18
    font_family = $font
    color = rgb(153, 153, 153)

    position = 0, 90
    halign = center
    valign = center
}

shape {
    monitor =
    size = 100, 34
    rounding = -1
    color = rgba(17, 17, 17, 0.65)
    border_size = 1
    border_color = rgba(2e2e2eff)

    position = 0, -90
    halign = center
    valign = center
}

label {
    monitor =
    text = <span foreground="##8a8a8a">󰌌</span> <span foreground="##f2f2f2">$LAYOUT[en,ru,ua]</span>
    font_size = 16
    font_family = $font
    onclick = hyprctl switchxkblayout all next

    position = 0, -90
    halign = center
    valign = center
}
